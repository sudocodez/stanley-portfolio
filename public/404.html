<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Stanley Gerson</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --paper: #f6f3ec;
        --ink: #1a1712;
        --accent: #a8452a;
        --muted: #6f675c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        line-height: 1.6;
      }
      .wrap {
        text-align: center;
        max-width: 34rem;
      }
      .code {
        font-family: "Georgia", serif;
        font-size: clamp(4rem, 16vw, 7rem);
        font-weight: 700;
        line-height: 1;
        color: var(--accent);
      }
      h1 {
        font-family: "Georgia", serif;
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        background: var(--ink);
        color: var(--paper);
        padding: 0.8rem 1.5rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
      }
      a:hover {
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>That page doesn't exist — but the work does. Head back to the homepage.</p>
      <a href="/">Back to homepage</a>
    </div>
  </body>
</html>
